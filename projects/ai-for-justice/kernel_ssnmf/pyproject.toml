[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kernel-ssnmf"
version = "0.1.0"
description = "Semi-NMF, Convex NMF, SSNMF and Kernel SSNMF for mixed-sign data, with SVM evaluation helpers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dakota Lin", email = "xdlin@stanford.edu" }]
keywords = ["nmf", "semi-nmf", "convex nmf", "ssnmf", "kernel methods", "dimensionality reduction", "topic modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.22", "scikit-learn>=1.0"]

[project.optional-dependencies]
dev = ["pytest", "build", "twine"]

[project.urls]
Homepage = "https://github.com/xiangdilin/portfolio/tree/main/projects/ai-for-justice/kernel_ssnmf"
Issues = "https://github.com/xiangdilin/portfolio/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kernel_ssnmf = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
